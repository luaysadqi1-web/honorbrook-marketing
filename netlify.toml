# Honorbrook Insurance — Netlify configuration
# Publishes the static site in /site and deploys the chatbot function in /netlify/functions.

[build]
  publish = "site"
  functions = "netlify/functions"

# Pretty URLs already work (Netlify serves /medicare-advantage from medicare-advantage.html).
# Add a couple of redirects so old/alternate paths resolve cleanly.
[[redirects]]
  from = "/medigap"
  to = "/medicare-supplement-medigap"
  status = 301

[[redirects]]
  from = "/group"
  to = "/group-health-insurance-shop"
  status = 301

# Redirects from the previous /services/ URL structure to the new clean URLs (301 = permanent)
[[redirects]]
  from = "/services/medicare-advantage.html"
  to = "/medicare-advantage"
  status = 301
[[redirects]]
  from = "/services/medicare-supplement.html"
  to = "/medicare-supplement-medigap"
  status = 301
[[redirects]]
  from = "/services/medicare-part-d.html"
  to = "/medicare-part-d"
  status = 301
[[redirects]]
  from = "/services/medicare.html"
  to = "/medicare-advantage"
  status = 301
[[redirects]]
  from = "/services/aca-marketplace.html"
  to = "/aca-health-insurance"
  status = 301
[[redirects]]
  from = "/services/final-expense.html"
  to = "/final-expense-life-insurance"
  status = 301
[[redirects]]
  from = "/services/life-insurance.html"
  to = "/life-insurance"
  status = 301
[[redirects]]
  from = "/services/annuities.html"
  to = "/annuities"
  status = 301
# Catch-all for any other old /services/ path
[[redirects]]
  from = "/services/*"
  to = "/"
  status = 301

# Googlebot requests /favicon.ico and the repo ships PNG icons only.
# Serve the existing 64px icon at that path instead of returning 404.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon-64.png"
  status = 200

# ---------------------------------------------------------------------------
# Force HTTPS at the edge.
# Netlify normally auto-redirects http -> https once the certificate is valid,
# but the apex served a 200 over plain http for months while the cert was
# broken, and Google indexed that URL. This makes the 301 explicit and
# deterministic rather than relying on auto-enforcement.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "http://honorbrook-insurance.com/*"
  to = "https://honorbrook-insurance.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.honorbrook-insurance.com/*"
  to = "https://honorbrook-insurance.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.honorbrook-insurance.com/*"
  to = "https://honorbrook-insurance.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Cache control
# The Netlify edge was holding HTML with a ~365-day TTL, which served stale
# pages to Googlebot. HTML must always revalidate; fingerprint-free assets get
# a short shared cache. Static media can cache long.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=60"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, s-maxage=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
