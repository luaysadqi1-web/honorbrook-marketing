<section id="quote" style="padding:0 20px">
<style>
.hb-quote{background:#fff;border:1px solid #dfe4ec;border-top:3px solid #c6a14a;border-radius:8px;box-shadow:0 8px 26px rgba(27,47,75,.07);padding:28px;margin:38px auto;max-width:620px}
.hb-quote h3{margin:0 0 4px;font-size:24px}
.hb-quote p.sub{margin:0 0 14px;color:#5b6678;font-size:16px}
.hb-quote label{display:block;font-weight:600;font-size:15px;margin:14px 0 5px}
.hb-quote input[type=text],.hb-quote input[type=tel],.hb-quote select{width:100%;padding:12px;border:1px solid #c9d1dc;border-radius:6px;font-size:17px;background:#fff;box-sizing:border-box}
.hb-quote .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hb-quote .consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13.5px;line-height:1.45;color:#5b6678;margin-top:16px}
.hb-quote .hb-field-err{border-color:#d9534f}
@media(max-width:560px){.hb-quote .row2{grid-template-columns:1fr}}
</style>
  <div class="hb-quote sans">
    <form action="https://formspree.io/f/xgobjlba" method="POST">
      <input type="hidden" name="_subject" value="Quote request: Guaranteed universal life (Honorbrook website)">
      <input type="hidden" name="Topic" value="Guaranteed universal life">
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <h3>Get a guaranteed universal life quote</h3>
      <p class="sub">We reply within one business day, by text if you prefer.</p>
      <label for="q25-name">Full name</label>
      <input id="q25-name" type="text" name="Name" autocomplete="name" required>
      <div class="row2">
        <div><label for="q25-phone">Mobile phone</label>
        <input id="q25-phone" type="tel" name="Phone" autocomplete="tel" required></div>
        <div><label for="q25-zip">ZIP code</label>
        <input id="q25-zip" type="text" name="ZIP" inputmode="numeric" autocomplete="postal-code" maxlength="5" required></div>
      </div>
      <div class="row2">
        <div><label for="q25-age">Your age</label>
        <select id="q25-age" name="Age range"><option>Under 40</option><option>40 to 49</option><option>50 to 59</option><option>60 to 69</option><option>70 to 79</option><option>80 or older</option></select></div>
        <div><label for="q25-how">Best way to reach you</label>
        <select id="q25-how" name="Contact preference"><option>Text me</option><option>Call me</option><option>Email me</option></select></div>
      </div>
      <label class="consent"><input type="checkbox" name="Consent" value="Yes" required>
        <span>By submitting, I authorize Honorbrook Insurance to contact me by phone or text (including automated means) about insurance. Consent isn't a condition of purchase; reply STOP to opt out. See our <a href="/privacy-policy" rel="noopener" target="_blank">Privacy Policy</a>.</span>
      </label>
      <button class="btn-primary sans" type="submit" style="margin-top:18px;width:100%">Send my request</button>
    </form>
  </div>
</section>
